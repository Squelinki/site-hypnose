# Configuration du CMS du site (Pages CMS : https://app.pagescms.org)
# Chaque entrée correspond à un fichier du dossier contenu/. Après chaque enregistrement dans le CMS,
# GitHub reconstruit et republie le site tout seul (environ 1 à 2 minutes).

media:
  input: assets/img/medias
  output: /assets/img/medias
  categories: [image]
  rename: safe

components:
  seo_titre:
    type: string
    label: Titre dans Google
    description: "Le titre bleu affiché par Google et dans l'onglet du navigateur. Idéalement moins de 60 caractères, avec « hypnose » et « Paris 16e »."
    required: true
  seo_description:
    type: text
    label: Description dans Google
    description: "Les deux lignes grises sous le titre dans Google. Idéalement 120 à 160 caractères."
  titre:
    type: text
    label: Titre
    description: "Mettez entre astérisques le mot à afficher en italique vert, par exemple : Pourquoi choisir *l'hypnose ?*"
  paragraphes:
    type: text
    label: Texte
    description: "Allez à la ligne pour commencer un nouveau paragraphe."

content:
  - name: annonces
    label: Annonces et décorations
    type: file
    path: contenu/annonces.yml
    fields:
      - name: annonces
        label: "Annonces de l'année (chacune revient automatiquement chaque année pendant sa période)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nom} · du {du} au {au}"
        fields:
          - name: nom
            label: Nom de l'annonce
            type: string
            required: true
            description: "Pour vous repérer (ex. Fêtes de fin d'année). Sert aussi d'adresse pour un lien vers l'encart : index.html#fetes-de-fin-d-annee."
          - name: active
            label: Activée
            type: boolean
            description: "Décochez pour mettre l'annonce en pause : elle ne s'affiche plus, même pendant sa période."
          - name: du
            label: Début (JJ/MM ou fête)
            type: string
            required: true
            pattern:
              regex: '^\s*(\d{1,2}\s*/\s*\d{1,2}|([Dd]imanche de )?[Pp][âaÂA][Qq][Uu][Ee][Ss]|[Jj]ourn[ée]e (mondiale |internationale |nationale )?du sommeil|[Ff][êe]te des [mp][èe]res)(\s*[-+−–]\s*\d{1,2}\s*(j|jours?)?)?\s*$'
              message: "Écrivez JJ/MM (ex. 01/12) ou une fête : Pâques, Journée du sommeil, Fête des mères, Fête des pères, éventuellement suivie d'un nombre de jours (ex. Pâques -6)"
            description: "Chaque année à partir de ce jour (heure de Paris). Pour une fête dont la date change chaque année, écrivez son nom : Pâques, Journée du sommeil, Fête des mères ou Fête des pères, avec si besoin un nombre de jours avant (-) ou après (+). Exemple : « Pâques -6 » = 6 jours avant Pâques. La date est recalculée toute seule chaque année."
          - name: au
            label: Fin incluse (JJ/MM ou fête)
            type: string
            required: true
            pattern:
              regex: '^\s*(\d{1,2}\s*/\s*\d{1,2}|([Dd]imanche de )?[Pp][âaÂA][Qq][Uu][Ee][Ss]|[Jj]ourn[ée]e (mondiale |internationale |nationale )?du sommeil|[Ff][êe]te des [mp][èe]res)(\s*[-+−–]\s*\d{1,2}\s*(j|jours?)?)?\s*$'
              message: "Écrivez JJ/MM (ex. 31/12) ou une fête : Pâques, Journée du sommeil, Fête des mères, Fête des pères, éventuellement suivie d'un nombre de jours (ex. Pâques +1)"
            description: "Dernier jour d'affichage. Une période peut chevaucher deux années (ex. du 15/12 au 15/01). Exemple avec une fête : « Pâques +1 » = le lundi de Pâques."
          - name: decorations
            label: Décorations
            type: select
            options:
              multiple: true
              values:
                - name: guirlande
                  label: Guirlande lumineuse (sous le menu, vague de lumière au clic)
                - name: neige
                  label: Neige (en haut des pages)
                - name: flocons
                  label: Neige sur tout le site (légère)
                - name: paillettes
                  label: Paillettes dorées
                - name: petales
                  label: Pétales de fleurs
                - name: muguet
                  label: Brin de muguet (jeu des 13 clochettes au clic)
                - name: soleil
                  label: Soleil d'été
                - name: feuilles
                  label: Feuilles d'automne
                - name: coeurs
                  label: Cœurs
                - name: cloches
                  label: Cloche de Pâques (sème des œufs au clic)
                - name: lune
                  label: Lune et étoiles (s'endort au clic)
                - name: notes
                  label: Notes de musique
                - name: galette
                  label: Galette des rois (jeu de la fève au clic)
                - name: crepe
                  label: Crêpe de la Chandeleur (à faire sauter au clic)
                - name: poisson
                  label: Poisson d'avril (se décolle au clic)
                - name: glace
                  label: Glace de l'été (une boule de plus à chaque clic)
                - name: feux
                  label: Feu d'artifice du 14 juillet (14 fusées au clic, puis bouquet final)
                - name: fanions
                  label: Fanions bleu-blanc-rouge (sous le menu, ils ondulent au clic)
                - name: rentree
                  label: Ardoise de la rentrée (bonnes résolutions au clic)
                - name: avent
                  label: Calendrier de l'Avent (le conseil du jour au clic, du 1er au 24 décembre)
          - name: bandeau
            label: Bandeau en haut de toutes les pages (facultatif)
            type: string
            description: "Une phrase courte, par exemple vos dates de fermeture. {annee} est remplacé par l'année en cours. Laissez vide : pas de bandeau."
          - name: bandeau_lien
            label: Lien du bandeau (facultatif)
            type: string
            description: "Par exemple contact.html#rendez-vous, ou index.html#nom-de-l-annonce pour renvoyer vers l'encart."
          - name: encart
            label: Encart sur la page d'accueil
            type: object
            fields:
              - name: afficher
                label: Afficher un encart sur la page d'accueil
                type: boolean
              - name: surtitre
                label: Surtitre
                type: string
                description: "Petite ligne au-dessus du titre. {annee} est remplacé par l'année en cours."
              - name: titre
                label: Titre
                type: string
              - name: texte
                component: paragraphes
              - name: points
                label: Points clés (tarif, lieu, horaires…)
                type: string
                list: true
                description: "Pensez à mettre à jour le tarif ici aussi s'il change."
              - name: image
                label: Image (facultative)
                type: image
                description: "Format carré conseillé. Les photos trop lourdes sont réduites automatiquement."
              - name: image_alt
                label: Description de l'image
                type: string
                description: "Ce que montre l'image, pour les personnes malvoyantes et pour Google."
              - name: dos
                label: Texte au dos de l'image (petit jeu)
                type: string
                description: "L'image se retourne comme un badge de récompense (clic, ou glissé du doigt). Au dos : « Badge débloqué », le nom et la date pris dans le surtitre, puis ce texte. Laissez vide pour la phrase prévue pour chaque occasion (ex. Pâques : « Bravo, vous avez trouvé l'œuf caché ! » ; Mois sans tabac : « Un jour après l'autre, vous allez y arriver ! »). Pour une annonce que vous créez vous-même : « Bravo, vous avez trouvé la face cachée ! ». {annee} = l'année en cours."
              - name: bouton
                label: Texte du bouton
                type: string
              - name: bouton_lien
                label: Lien du bouton
                type: string
                description: "Par défaut : contact.html#rendez-vous"
              - name: bouton_telephone
                label: Ajouter un bouton « téléphone »
                type: boolean
              - name: bouton_cadeau
                label: Proposer d'offrir une séance (bon cadeau)
                type: boolean
                description: "Ajoute sous les boutons la ligne « Envie d'offrir une séance ? » (texte réglé dans la rubrique Bon cadeau). Son lien ouvre le formulaire de contact avec le message déjà préparé. Idéal pour les fêtes, la Saint-Valentin ou la fête des mères."

  - name: infos
    label: Coordonnées, horaires et tarifs
    type: file
    path: contenu/infos-pratiques.yml
    fields:
      - name: telephone
        label: Téléphone
        type: string
        required: true
        description: "Repris partout sur le site (en-tête, pied de page, boutons « Appeler »)."
      - name: email
        label: Adresse e-mail
        type: string
        required: true
      - name: adresse
        label: Adresse du cabinet
        type: string
        required: true
        description: "Si le cabinet change d'adresse, le plan dessiné de la page « Plan et accès » disparaît tout seul (il montre le 30 rue de Chaillot) ; la page reste, avec l'adresse et les boutons d'itinéraire."
      - name: code_postal
        label: Code postal
        type: string
        required: true
      - name: ville
        label: Ville
        type: string
        required: true
      - name: quartier
        label: Quartier (forme courte)
        type: string
        description: "Ex. Paris 16e — affiché sous le nom en haut des pages."
      - name: acces
        label: Accès (métro principal)
        type: string
      - name: acces_detail
        label: Autres accès (facultatif)
        type: text
        description: "Vous pouvez aussi indiquer ici l'étage ou le code de la porte."
      - name: horaires
        label: Horaires d'ouverture
        type: object
        list:
          min: 1
          collapsible:
            collapsed: false
            summary: "{de} – {a}"
        description: "Le texte des horaires (« Du lundi au vendredi, de 9 h à 19 h ») est composé automatiquement et transmis à Google."
        fields:
          - name: jours
            label: Jours
            type: select
            required: true
            options:
              multiple: true
              values: [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]
          - name: de
            label: De
            type: string
            required: true
            pattern:
              regex: '^\d{1,2} ?h( ?\d{2})?$'
              message: "Écrivez par exemple 9 h ou 18 h 30"
          - name: a
            label: À
            type: string
            required: true
            pattern:
              regex: '^\d{1,2} ?h( ?\d{2})?$'
              message: "Écrivez par exemple 19 h ou 18 h 30"
      - name: tarifs
        label: Tarifs
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{intitule} : {prix} €"
        fields:
          - name: intitule
            label: Intitulé (page Tarifs & contact)
            type: string
            required: true
          - name: intitule_court
            label: Intitulé court (page d'accueil)
            type: string
          - name: precision
            label: Précision (facultative)
            type: string
          - name: prix
            label: Prix en euros
            type: number
            required: true
      - name: duree_seance
        label: Durée d'une séance (sous les tarifs de l'accueil)
        type: string
      - name: paiement
        label: Moyens de paiement
        type: string
      - name: paiement_precision
        label: Précision sur le paiement
        type: string
      - name: remboursement
        label: Remboursement (page Tarifs & contact)
        type: text
      - name: instagram
        label: Page Instagram (adresse complète)
        type: string
      - name: facebook
        label: Page Facebook (adresse complète)
        type: string
      - name: linkedin
        label: Profil LinkedIn (adresse complète)
        type: string
      - name: fiche_google
        label: Fiche Google (adresse complète, facultative)
        type: string
        description: "Lien de la fiche d'établissement Google. Un lien « Laisser un avis Google » s'affiche près des témoignages. Une fois la fiche revendiquée, remplacez-le par le lien du bouton « Demander des avis », qui ouvre directement le formulaire d'avis."
      - name: formulaire
        label: Adresse Formspree du formulaire de contact
        type: string
        description: "Ne pas modifier, sauf changement de compte Formspree."

  - name: avis
    label: Avis
    type: file
    path: contenu/avis.yml
    fields:
      - name: recommandations
        label: Nombre total de recommandations sur Facebook
        type: number
        description: "Avec ou sans commentaire. La différence avec la liste ci-dessous est indiquée automatiquement."
      - name: pourcentage
        label: Pourcentage de recommandations
        type: number
      - name: lien
        label: Lien vers les avis Facebook
        type: string
      - name: liste
        label: Avis affichés (le plus récent en premier)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nom} · {date}"
        fields:
          - name: texte
            label: Avis
            type: text
            required: true
          - name: nom
            label: Prénom et initiale du nom
            type: string
            required: true
          - name: date
            label: Date de publication
            type: date
            options:
              format: yyyy-MM-dd

  - name: vrai_faux
    label: "Vrai ou faux ? (page d'accueil)"
    type: file
    path: contenu/vrai-ou-faux.yml
    fields:
      - name: actif
        label: "Afficher « Vrai ou faux ? » sur la page d'accueil"
        type: boolean
        default: true
        description: "Désactivé : la FAQ classique « Vos questions » s'affiche à la place, exactement comme avant. Ses questions se modifient dans la rubrique « Questions fréquentes (FAQ) », juste en dessous. Rien n'est effacé : réactivez quand vous voulez."
      - name: titre
        component: titre
        required: true
      - name: introduction
        label: Introduction
        type: text
      - name: affirmations
        label: "Affirmations (une carte chacune : on choisit Vrai ou Faux, la carte se retourne)"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{affirmation} → {reponse}"
        fields:
          - name: affirmation
            label: Affirmation
            type: string
            required: true
            description: "Une phrase courte, à laquelle on répond par vrai ou faux. Ex. : Pendant une séance d'hypnose, on dort."
          - name: reponse
            label: Bonne réponse
            type: select
            required: true
            options:
              values:
                - name: vrai
                  label: Vrai
                - name: faux
                  label: Faux
          - name: explication
            label: Explication (au dos de la carte)
            type: text
            description: "Deux ou trois phrases au plus. Pensez à la mettre à jour si les tarifs, le paiement ou le remboursement changent."

  - name: faq
    label: Questions fréquentes (FAQ)
    type: file
    path: contenu/faq.yml
    fields:
      - name: questions
        label: Questions (la première est ouverte par défaut)
        description: "Affichées sur la page d'accueil seulement quand « Vrai ou faux ? » est désactivé (interrupteur en haut de la rubrique « Vrai ou faux ? »)."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: question
            label: Question
            type: string
            required: true
          - name: reponse
            label: Réponse
            type: text
            required: true

  - name: themes
    label: "Pages thématiques (arrêt du tabac, sommeil, stress…)"
    type: collection
    path: contenu/themes
    format: yaml
    filename: "{primary}.yml"
    view:
      primary: titre_court
      fields: [titre_court, adresse, ordre]
    fields:
      - name: titre_court
        label: Nom court
        type: string
        required: true
        description: "Ex. : Sommeil. Il apparaît dans les cartes de la page Accompagnements, le pied de page et le fil d'Ariane."
      - name: adresse
        label: Adresse de la page (sans .html)
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9]+(-[a-z0-9]+)*$'
          message: "Lettres minuscules sans accents, chiffres et tirets seulement (ex. hypnose-sommeil)"
        description: "Ex. : hypnose-sommeil donne hypnose-roulleau.fr/hypnose-sommeil.html. Ne la changez plus une fois la page publiée (Google la connaît)."
      - name: publier
        label: Publiée
        type: boolean
        default: true
        description: "Décochez pour retirer la page du site sans l'effacer."
      - name: ordre
        label: Ordre d'affichage
        type: number
        description: "1 = en premier."
      - name: illustration
        label: Dessin
        type: select
        options:
          values:
            - name: tabac
              label: Cigarette cassée d'où sort une pousse
            - name: sommeil
              label: Lune, étoiles et nuage
            - name: stress
              label: Galets en équilibre au bord de l'eau
            - name: poids
              label: Pomme
            - name: phobies
              label: Oiseau qui sort de sa cage
            - name: aucune
              label: Pas de dessin
      - name: resume
        label: Résumé (cartes de la page Accompagnements)
        type: text
      - name: seo_titre
        component: seo_titre
      - name: seo_description
        component: seo_description
      - name: surtitre
        label: Surtitre
        type: string
      - name: titre
        component: titre
        required: true
      - name: introduction
        label: Introduction
        type: text
        required: true
      - name: sections
        label: Paragraphes
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titre}"
        fields:
          - name: titre
            label: Intertitre
            type: string
          - name: texte
            component: paragraphes
      - name: tarif
        label: Tarif affiché (mot-clé)
        type: string
        description: "Un mot de l'intitulé du tarif à afficher dans « Infos pratiques » (ex. tabac). Vide = le premier tarif."
      - name: exercice_respiration
        label: Lien vers l'exercice de respiration
        type: boolean
      - name: calculateur_tabac
        label: Calculateur « Combien vous coûte la cigarette ? »
        type: boolean
      - name: prix_paquet
        label: Prix moyen d'un paquet de 20 (calculateur)
        type: number
        description: "En euros, ex. 12.5. À mettre à jour de temps en temps (le visiteur peut aussi le changer)."

  - name: surprise
    label: Surprise cachée (pendule)
    type: file
    path: contenu/surprise.yml
    fields:
      - name: active
        label: Activée
        type: boolean
        description: "Le pendule apparaît quand on clique 5 fois de suite sur le logo du pied de page, ou quand on tape « hypnose » au clavier."
      - name: titre
        label: Titre
        type: string
      - name: message
        label: Phrases (une par ligne, elles apparaissent l'une après l'autre)
        type: text
      - name: bouton
        label: Texte du bouton
        type: string
      - name: reveil
        label: Phrase du réveil
        type: string

  - name: bon_cadeau
    label: Bon cadeau
    type: file
    path: contenu/bon-cadeau.yml
    fields:
      - name: actif
        label: Afficher la mention « bon cadeau »
        type: boolean
        description: "Une ligne discrète sous les tarifs (page Tarifs & contact)."
      - name: texte
        label: Phrase
        type: text
      - name: lien
        label: Texte du lien
        type: string
      - name: message
        label: Début de message proposé dans le formulaire
        type: text

  - name: avent
    label: Calendrier de l'Avent
    type: file
    path: contenu/calendrier-avent.yml
    fields:
      - name: conseils
        label: "Conseils du jour (1er au 24 décembre, dans l'ordre)"
        type: string
        list: true
        description: "Le premier s'affiche le 1er décembre, le deuxième le 2, etc., quand on ouvre le paquet cadeau de la décoration « Calendrier de l'Avent ». Une phrase courte par jour (deux lignes au plus)."

  - name: lectures
    label: Lectures et émissions
    type: file
    path: contenu/lectures.yml
    fields:
      - name: introduction
        label: Introduction
        type: text
      - name: liens
        label: Liens
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{source} · {titre}"
        fields:
          - name: type
            label: Rubrique
            type: select
            required: true
            options:
              values:
                - name: ecouter
                  label: À écouter
                - name: lire
                  label: À lire
          - name: source
            label: Source (média)
            type: string
          - name: date
            label: Date (en toutes lettres)
            type: string
            description: "Par exemple : 31 décembre 2025"
          - name: duree
            label: Durée (émissions)
            type: string
            description: "Par exemple : 5 min"
          - name: titre
            label: Titre
            type: string
            required: true
          - name: description
            label: Une phrase de présentation
            type: text
          - name: lien
            label: Adresse de la page
            type: string
            required: true

  - name: menu
    label: Menu et pied de page
    type: file
    path: contenu/menu.yml
    fields:
      - name: menu
        label: "Menu (en haut de chaque page)"
        type: object
        description: "Les noms des pages dans le menu du haut. Une case vide reprend le nom d'origine. Les adresses des pages ne changent pas. Si les noms deviennent trop longs pour tenir sur une ligne, le menu se resserre, puis le bouton se masque, puis le menu passe dans le bouton à trois traits : rien ne déborde."
        fields:
          - name: hypnose
            label: "1er lien : page « L'hypnose, c'est quoi ? »"
            type: string
            options:
              maxlength: 30
          - name: indications
            label: "2e lien : page « Accompagnements » (stress, tabac, sommeil…)"
            type: string
            description: "Le nom de la page qui présente tous les accompagnements (son adresse reste indications.html). Il apparaît aussi dans le fil d'Ariane en haut des pages thématiques. Les autres textes de cette page se changent dans Textes des pages › Accompagnements, ceux de l'accueil dans Textes des pages › Accueil › Bloc « Accompagnements »."
            options:
              maxlength: 30
          - name: deroulement
            label: "3e lien : page « Déroulement d'une séance »"
            type: string
            options:
              maxlength: 30
          - name: qui
            label: "4e lien : page « Qui suis-je ? »"
            type: string
            options:
              maxlength: 30
          - name: contact
            label: "5e lien : page « Tarifs & contact »"
            type: string
            options:
              maxlength: 30
          - name: bouton
            label: "Bouton vert à droite du menu"
            type: string
            description: "Il ouvre le formulaire de rendez-vous (page Tarifs & contact)."
            options:
              maxlength: 30
      - name: pied
        label: "Pied de page (en bas de chaque page)"
        type: object
        description: "À côté du logo, le pied de page a trois colonnes : « Cabinet » (adresse, téléphone, horaires), « Le site » (liens vers les autres pages du menu, avec des noms un peu plus longs, puis la page « Plan et accès ») et « Accompagnements » (arrêt du tabac, stress, sommeil…, puis « Tous les accompagnements → », le lien vers la page qui les présente tous). Une case vide reprend le nom d'origine. Les adresses des pages ne changent pas : Google et les liens existants continuent de fonctionner."
        fields:
          - name: titre_cabinet
            label: "Titre de la colonne « Cabinet » (adresse, téléphone, horaires)"
            type: string
            options:
              maxlength: 40
          - name: titre_site
            label: "Titre de la colonne « Le site » (liens vers les autres pages du menu)"
            type: string
            options:
              maxlength: 40
          - name: hypnose
            label: "Colonne « Le site », 1er lien : page « L'hypnose, c'est quoi ? »"
            type: string
            options:
              maxlength: 50
          - name: deroulement
            label: "Colonne « Le site », 2e lien : page « Déroulement d'une séance »"
            type: string
            options:
              maxlength: 50
          - name: qui
            label: "Colonne « Le site », 3e lien : page « Qui suis-je ? »"
            type: string
            options:
              maxlength: 50
          - name: contact
