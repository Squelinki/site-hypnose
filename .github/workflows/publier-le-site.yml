# Construit et publie le site sur GitHub Pages.
# Se lance tout seul à chaque modification (depuis le CMS ou depuis GitHub), et chaque 1er janvier
# pour mettre à jour l'année du pied de page. Bouton « Run workflow » (onglet Actions) pour le relancer à la main.
# Si la construction échoue, le site en ligne ne change pas : le message d'erreur s'affiche dans l'onglet Actions.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 5 1 1 *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les outils
        run: pip install -r requirements.txt
      - name: Construire le site
        run: python construire.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v5
