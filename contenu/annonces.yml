annonces:
  - nom: Nouvelle année
    active: true
    du: 01/01
    au: 31/01
    decorations:
      - paillettes
    bandeau: Belle et heureuse année {annee} !
    encart:
      afficher: true
      surtitre: Nouvelle année · janvier {annee}
      titre: Et si cette année était celle du changement ?
      texte: >
        Je vous souhaite d'être libre ! Libre d'être vous-même, libre de
        réaliser vos rêves.

        Arrêter de fumer, retrouver un sommeil apaisé, apprivoiser le stress,
        prendre confiance en vous : l'hypnose peut vous aider à transformer vos
        bonnes résolutions en véritables changements, à votre rythme.
      bouton: Prendre rendez-vous
      bouton_lien: contact.html#rendez-vous
      bouton_telephone: true
