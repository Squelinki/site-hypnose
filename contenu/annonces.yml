  - nom: Journée du sommeil
    active: true
    du: Journée du sommeil -6
    au: Journée du sommeil
    decorations:
      - lune
    bandeau: "Journée du sommeil : et si l'hypnose vous aidait à retrouver des nuits
      paisibles ?"
    bandeau_lien: index.html#journee-du-sommeil
    encart:
      afficher: true
      surtitre: Journée du sommeil · mars {annee}
      titre: Retrouver un sommeil apaisé
      texte: >
        Chaque année en mars, la Journée du sommeil rappelle combien nos nuits
        comptent pour notre santé, notre humeur et notre énergie.

        Difficultés d'endormissement, réveils nocturnes, pensées qui tournent en
        boucle : l'hypnose peut vous aider à relâcher les tensions, à apaiser le
        mental et à retrouver des nuits plus sereines, à votre rythme.
      bouton: Prendre rendez-vous
      bouton_lien: contact.html#rendez-vous
      bouton_telephone: true
