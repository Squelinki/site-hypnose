  - nom: Mois sans tabac
    active: true
    du: 01/11
    au: 30/11
    encart:
      afficher: true
      surtitre: Mois sans tabac · novembre {annee}
      titre: Arrêter de fumer avec l'hypnose
      texte: >
        Du 1er au 30 novembre, le Mois sans tabac invite les fumeurs à relever
        un défi collectif : arrêter de fumer pendant 30 jours. Un cap décisif,
        puisque d'après Santé publique France, 30 jours sans tabac multiplient
        par cinq les chances d'arrêter durablement.

        L'hypnose peut vous aider à franchir le pas, puis à tenir. Ensemble,
        nous travaillons sur l'envie de fumer, sur les habitudes et les émotions
        qui l'accompagnent, et sur votre motivation.
      points:
        - "Consultation « arrêt du tabac » : 200 €"
        - Au cabinet, 30 rue de Chaillot, Paris 16e
        - Du lundi au vendredi, de 9 h à 19 h, sur rendez-vous
      image: /assets/img/medias/mois-sans-tabac-caroline-roulleau.jpg
      image_alt: "Visuel « En novembre, on arrête ensemble ! » : Caroline Roulleau,
        hypnothérapeute ericksonienne et praticienne PNL, avec le logo du Mois
        sans tabac"
      bouton: Prendre rendez-vous
      bouton_lien: contact.html#rendez-vous
      bouton_telephone: true
