      surtitre: Rentrée {annee}
      titre: Une rentrée plus sereine
      texte: >
        Reprise du travail, nouveaux projets, examens à préparer : la rentrée
        rime souvent avec pression.

        L'hypnose peut vous accompagner pour mieux gérer le stress, retrouver un
        sommeil apaisé, gagner en concentration et en confiance en vous.
      bouton: Prendre rendez-vous
