  - nom: "Journée mondiale sans tabac"
    active: true
    du: "24/05"
    au: "31/05"
    decorations: []
    bandeau: "31 mai, Journée mondiale sans tabac : et si c'était le bon moment pour arrêter ?"
    bandeau_lien: "index.html#journee-mondiale-sans-tabac"
    encart:
      afficher: true
      surtitre: "Journée mondiale sans tabac · 31 mai {annee}"
      titre: "Arrêter de fumer avec l'hypnose"
      texte: |
        Chaque 31 mai, la Journée mondiale sans tabac invite les fumeurs à faire le point… et peut-être à passer le cap.
        L'hypnose peut vous aider à franchir le pas, puis à tenir. Ensemble, nous travaillons sur l'envie de fumer, sur les habitudes et les émotions qui l'accompagnent, et sur votre motivation.
      points:
        - "Consultation « arrêt du tabac » : 200 €"
        - "Au cabinet, 30 rue de Chaillot, Paris 16e"
      image: "/assets/img/medias/journee-mondiale-sans-tabac-caroline-roulleau.jpg"
      image_alt: "Visuel « Journée mondiale sans tabac : et si c'était le bon moment pour arrêter ? », avec la date du 31 mai : Caroline Roulleau, hypnothérapeute ericksonienne et praticienne PNL"
      bouton: "Prendre rendez-vous"
      bouton_lien: "contact.html#rendez-vous"
      bouton_telephone: true
