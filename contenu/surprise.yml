active: true
titre: "Regardez bien le pendule…"
message: |
  Laissez vos yeux suivre doucement son mouvement…
  Votre respiration ralentit… vos épaules se relâchent…
  Vous vous sentez de plus en plus détendu…
  Rassurez-vous : en séance, l'hypnose ne ressemble pas du tout à ça !
bouton: "Se réveiller"
reveil: "1… 2… 3… Vous êtes bien réveillé(e) ! Bravo, vous avez trouvé la surprise cachée."
