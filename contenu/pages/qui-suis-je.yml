seo_titre: "Qui suis-je ? Caroline Roulleau, hypnothérapeute à Paris 16e"
seo_description: "Caroline Roulleau, hypnothérapeute ericksonienne et praticienne PNL, diplômée de l'Institut Français d'Hypnose Ericksonienne (IFHE). Cabinet à Paris 16e."
surtitre: "Qui suis-je ?"
titre: "Caroline *Roulleau*"
metier: "Hypnothérapeute ericksonienne et praticienne PNL"
presentation: |
  À la suite d'une première vie dans l'univers des chiffres et de la comptabilité, dans un grand groupe industriel du CAC 40, j'ai éprouvé le besoin, au fil des rencontres, des apprentissages et des épreuves, de me pencher sur l'humain, sa relation à l'autre, ainsi que sur son épanouissement personnel.
  Je me suis donc naturellement tournée vers cet outil fascinant d'accompagnement, de changement et de guérison qu'est l'hypnose !
formation_titre: "Formation"
formation_texte: "Diplômée de l'Institut Français d'Hypnose Ericksonienne (IFHE) en :"
