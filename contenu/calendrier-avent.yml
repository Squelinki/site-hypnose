# Calendrier de l'Avent : un petit conseil bien-être par jour, du 1er au 24 décembre.
# Il s'affiche quand on ouvre le paquet cadeau (décoration « avent » dans les annonces). Modifiable dans le CMS.
conseils:
  - "Prenez trois grandes respirations, en soufflant un peu plus longtemps que vous n'inspirez."
  - "Ce soir, éteignez les écrans une heure avant de vous coucher."
  - "Notez trois petites choses agréables de votre journée, même minuscules."
  - "Offrez-vous dix minutes de marche dehors, sans téléphone, en observant ce qui vous entoure."
  - "Buvez un grand verre d'eau, lentement, en savourant chaque gorgée."
  - "Posez une main sur votre ventre et sentez-le se soulever et redescendre, pendant une minute."
  - "Dites non, gentiment, à une demande qui vous coûte : c'est aussi prendre soin de vous."
  - "Retrouvez un souvenir heureux, avec ses couleurs, ses sons et ses parfums. Restez-y quelques instants."
  - "Détendez vos épaules, desserrez la mâchoire, relâchez le front. Juste ça."
  - "Écrivez ce qui vous préoccupe : une fois sur le papier, votre esprit peut se reposer."
  - "Prenez votre prochain repas sans écran, en savourant chaque bouchée."
  - "Envoyez un message à quelqu'un qui compte pour vous, simplement pour lui dire que vous pensez à lui."
  - "Accordez-vous quelques minutes les yeux fermés, sans rien faire. Rien du tout."
  - "Écoutez une musique que vous aimez, les yeux fermés, sans rien faire d'autre."
  - "Ce soir, couchez-vous un quart d'heure plus tôt que d'habitude."
  - "Félicitez-vous pour une chose réussie aujourd'hui, même petite."
  - "Imaginez un lieu où vous vous sentez parfaitement bien, et promenez-vous-y quelques minutes."
  - "Étirez-vous longuement, comme au réveil, en bâillant si l'envie vient."
  - "Respirez en carré : inspirez sur quatre temps, retenez quatre temps, expirez quatre temps, attendez quatre temps."
  - "Rangez un petit coin de votre intérieur : un espace dégagé repose aussi le regard."
  - "Riez ! Un film, un souvenir, une vidéo drôle : le rire détend tout le corps."
  - "Pendant les préparatifs, réservez un moment rien que pour vous, et notez-le dans votre agenda."
  - "Pensez à ce que vous avez vraiment envie de vivre pendant ces fêtes, plutôt qu'à ce qu'il « faudrait » faire."
  - "Ce soir, savourez l'instant présent, tout simplement. Joyeux Noël !"
