titre_court: "Poids et alimentation"
adresse: "hypnose-poids"
ordre: 4
illustration: poids
resume: "Grignotage, compulsions, émotions et alimentation : retrouver une relation plus sereine à la nourriture."
seo_titre: "Hypnose et perte de poids à Paris 16e | Caroline Roulleau"
seo_description: "Grignotage, compulsions, alimentation émotionnelle : comment l'hypnose peut vous aider à retrouver une relation apaisée à la nourriture. Paris 16e."
surtitre: "Hypnose et poids de forme"
titre: "Retrouver *son poids de forme*"
introduction: "Grignotage, envies irrépressibles, repas avalés sans y penser, nourriture qui console… Bien souvent, ce n'est pas la volonté qui manque : ce sont des automatismes et des émotions qui prennent le dessus. L'hypnose peut vous aider à retrouver une relation plus sereine à l'alimentation."
sections:
  - titre: "Au-delà des régimes"
    texte: |
      L'hypnose n'est pas un régime, et elle ne fait pas maigrir à votre place. Elle travaille sur ce qui se joue derrière vos habitudes alimentaires : le stress, l'ennui, la fatigue, les émotions que l'on apaise en mangeant, l'image que vous avez de vous-même.
  - titre: "Ce que nous travaillons en séance"
    texte: |
      Après un échange sur vos habitudes et sur vos objectifs, je vous guide dans un état hypnotique pour renforcer votre motivation, apaiser les envies compulsives et vous aider à être de nouveau à l'écoute de vos sensations de faim et de satiété.
      Le but : que les bons choix deviennent plus naturels, sans frustration, et que vous retrouviez confiance en vous et en votre corps.
  - titre: "Bon à savoir"
    texte: |
      En cas de troubles du comportement alimentaire (anorexie, boulimie, hyperphagie…) ou de problème de santé lié au poids, un suivi médical est indispensable : l'hypnose peut alors venir en complément, en lien avec votre médecin.
