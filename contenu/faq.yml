questions:
  - question: Combien de temps dure une séance ?
    reponse: "De 1 à 2 heures selon le type de séance. La première est souvent plus
      longue : elle permet d'analyser le problème et de faire une première
      intervention."
  - question: Combien de séances faut-il prévoir ?
    reponse: "En moyenne de 2 à 10 séances : s'agissant d'une thérapie brève,
      rarement plus. Nous déterminons ensemble le rythme et le nombre de
      séances."
  - question: Vais-je dormir pendant la séance ?
    reponse: "Non. L'hypnose n'est pas une forme de sommeil : c'est un état naturel,
      comparable à celui que l'on connaît lorsque l'on somnole dans un train en
      continuant à percevoir ce qui se passe autour. Vous pouvez même, dans
      certains cas, parler pour répondre à mes questions."
  - question: Vais-je perdre le contrôle ?
    reponse: Non. Même en état modifié de conscience, vous restez « conscient » de
      ce qui se passe autour de vous, et je ne peux en aucun cas vous suggérer
      de faire quelque chose qui serait contraire à vos valeurs.
  - question: Que ressent-on à la fin de la séance ?
    reponse: "Vous revenez à vous, en pleine forme, parfois avec la sensation
      d'avoir fait un long voyage, parfois avec l'impression qu'il ne s'est rien
      passé. Votre inconscient, lui, sait ce qui s'est passé : le changement est
      en marche…"
  - question: Les séances sont-elles remboursées ?
    reponse: "Elles ne sont pas remboursées par la Sécurité sociale. Néanmoins,
      certaines mutuelles prennent en charge une partie des séances sur facture
      : renseignez-vous !"
  - question: Quels sont les moyens de paiement ?
    reponse: Chèque, espèces ou Wero. Les cartes bancaires ne sont pas acceptées.
